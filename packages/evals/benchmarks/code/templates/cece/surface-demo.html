<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surface HTML 测试</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+SC:wght@400;600;800&display=swap');
    :root { --ink:#17211b; --paper:#f4eddf; --lime:#c7f36b; --coral:#ff785a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); font-family:'Noto Sans SC',sans-serif; background:radial-gradient(circle at 15% 15%,#fff8 0 8%,transparent 9%),linear-gradient(135deg,#e7d5b5,var(--paper) 52%,#b9d7c0); }
    main { width:min(880px,92vw); padding:clamp(28px,6vw,72px); border:2px solid var(--ink); border-radius:32px; background:#fffaf0dd; box-shadow:16px 16px 0 var(--ink); position:relative; overflow:hidden; }
    main::after { content:'SURFACE'; position:absolute; right:-18px; top:28px; padding:8px 28px; background:var(--coral); transform:rotate(8deg); font-weight:800; letter-spacing:.18em; }
    .eyebrow { text-transform:uppercase; letter-spacing:.24em; font-size:.75rem; font-weight:800; }
    h1 { font-family:'DM Serif Display',serif; font-size:clamp(3rem,9vw,7rem); line-height:.82; margin:28px 0; font-weight:400; }
    h1 span { color:var(--coral); }
    p { max-width:600px; font-size:1.05rem; line-height:1.8; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:32px; }
    .card { border:2px solid var(--ink); border-radius:18px; padding:18px; background:white; transform:translateY(20px); opacity:0; animation:rise .55s forwards; }
    .card:nth-child(2){ animation-delay:.12s;background:var(--lime); }.card:nth-child(3){animation-delay:.24s;}
    button { margin-top:28px; border:0; border-radius:999px; padding:14px 22px; background:var(--ink); color:white; font:600 1rem inherit; cursor:pointer; }
    #count { display:inline-grid; place-items:center; width:32px; height:32px; margin-left:8px; border-radius:50%; color:var(--ink); background:var(--lime); }
    @keyframes rise { to { transform:none; opacity:1; } }
    @media(max-width:620px){ main{box-shadow:8px 8px 0 var(--ink)} .cards{grid-template-columns:1fr} main::after{display:none} }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Right panel · live preview</div>
    <h1>看见<br><span>Surface.</span></h1>
    <p>这是一个完整 HTML 页面测试：包含响应式布局、Web 字体、动画和按钮交互。缩放右栏可以观察布局变化。</p>
    <section class="cards">
      <article class="card"><strong>01</strong><br>响应式排版</article>
      <article class="card"><strong>02</strong><br>错落视觉语言</article>
      <article class="card"><strong>03</strong><br>原生交互能力</article>
    </section>
    <button id="tester">点击测试交互 <span id="count">0</span></button>
  </main>
  <script>
    const button = document.querySelector('#tester');
    const count = document.querySelector('#count');
    button.addEventListener('click', () => { count.textContent = Number(count.textContent) + 1; });
  </script>
</body>
</html>
