name: neox_app
description: "Neox mobile client (iOS + Android) — Desktop + Cloud 三模协同"
publish_to: 'none'

version: 4.1.1+40101

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理 — Riverpod 跟 React hooks 思路一致, 比 BLoC 轻
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.6.2

  # 数据库 — drift SQLite 类型安全 ORM
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # 网络
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # 加密 (X25519 + AES-GCM, 对应协议 §4 Mode B)
  cryptography: ^2.7.0

  # 生物识别 (应用锁: 指纹/Face ID) — Phase 5 商业化安全
  local_auth: ^2.3.0

  # 设备信息 (Phone/iPad 真机型 + 用户起的设备名) — 上报给 Desktop 显示
  device_info_plus: ^11.0.0

  # sha256 (设备指纹 X-Device-FP 计算用, 跟 desktop / server 同算法)
  crypto: ^3.0.5

  # 图片/文件选取 — composer 附件入口
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # mDNS LAN 发现 (Mode A)
  multicast_dns: ^0.3.2+8

  # 网络变化监听 (wifi↔蜂窝 / 换 wifi / DHCP 换 IP) — 触发重连 + 重启 mDNS。
  # 原版完全没有, 切网后旧 socket 半开不重连, 是"有时候连不上"头号成因。
  connectivity_plus: ^6.1.0

  # QR 扫描 + 显示 (配对用)
  # mobile_scanner 5.x 在 Android 16 + MIUI 上 ML Kit binding 不识别,
  # 升 7.x (最新, 重写了 Android plugin)
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0

  # 音频/语音 (Voice 助手) — Phase 1.D 再加, record 5.2 跟 record_linux 接口
  # 暂不兼容, 等版本稳定再启用; Phase 1.C Mode A 不需要
  # record: ^5.2.0
  # just_audio: ^0.9.42
  # flutter_sound: ^9.10.4

  # 推送 (本地通知 + FCM)
  # 19.x 起才支持 Android 15/16。17.2.4 在 Android 16 上 zonedSchedule 不报错
  # 但压根不往 AlarmManager 注册闹钟 (2026-08-11 模拟器实测: dumpsys alarm 里
  # 一条 pending 都没有), 定时提醒静默失效。
  flutter_local_notifications: ^19.0.0
  # zonedSchedule 需要 TZDateTime — flutter_local_notifications 的传递依赖,
  # 但我们直接 import 了, 按 depend_on_referenced_packages 必须显式声明。
  timezone: ^0.10.0
  # 取设备真实 IANA 时区名 (Asia/Shanghai / America/Los_Angeles).
  # timezone 包的 tz.local 默认是 UTC, 不设就会把"3 分钟后"算成几小时前 ——
  # 2026-08-11 模拟器实测踩到, 提醒直接排不上。
  flutter_timezone: ^3.0.1

  # 存储
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # i18n (跟 flutter_localizations 锁的版本对齐)
  intl: ^0.20.2

  # 版本号 / 包信息 — 关于页显示真实版本, 以及版本检查 (硬编码的 "v2.2" 已移除)
  package_info_plus: ^8.0.2
  # 厂商官方 mark 是 SVG (跟桌面端同一批素材), 位图会在高 DPI 上糊
  flutter_svg: ^2.0.10

  # 工具
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Markdown 渲染 — flutter_markdown 6.x deprecated, 换 _plus 维护版
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.3.0 # code block builder 需要 md.Element
  http: ^1.6.0

  # 系统分享面板 — agent 产出的文件 (PPT/图片/PDF) 的唯一出口.
  # 用户原话: "我让他做个 PPT, 做完了结果不能下载"。分享面板同时覆盖
  # "存到文件"/"微信发出去"/AirDrop, 比自己做一个下载目录实在。
  share_plus: ^10.1.2

  # 外部浏览器打开收银台/厂商控制台 (Phase 3 订阅闭环)
  url_launcher: ^6.3.1
  speech_to_text: ^7.4.0

  # 手机本地 Agent 运行时 (工具调用循环, 零 Flutter 依赖) — 独立包见 agentsdk/
  neox_agent_sdk:
    path: agentsdk
  flutter_web_auth_2: ^5.0.3
  google_sign_in: ^7.2.0
  # Sign in with Apple —— App Store 4.8 硬要求: 接了第三方登录 (GitHub/Google)
  # 就必须提供等价的隐私登录选项, 而允许隐藏真实邮箱只有 Apple 的私密转发做得到。
  # 只在 iOS 用 (Android 上要走 web 授权流, 我们没有 4.8 义务, 不值得多养一条链路)。
  sign_in_with_apple: ^6.1.3
  # 应用内购买 —— iOS 上卖数字订阅只能走 IAP (审核指南 3.1.1)。
  # Android 侧仍走官网收银台 (Google Play 的分成规则我们暂不接), 所以这个包只在 iOS 用。
  in_app_purchase: ^3.2.0
  flutter_displaymode: ^0.7.0
  archive: ^4.3.0
  sherpa_onnx: ^1.13.7
  record: ^6.2.1
  llama_flutter_android: ^0.2.6
  camera: ^0.11.2+1
  gal: ^2.3.3
  # 用仓里打过补丁的 2.3.2 (third_party/cryptography_flutter, 原因见其中 NEOX_PATCH.md):
  # pub 上的 2.3.2 安卓侧编不过, 2.3.4 又跟 Flutter 3.32 的 meta 冲突。
  cryptography_flutter:
    path: third_party/cryptography_flutter
  # 电脑上做出来的视频 / 音频在手机里边下边播 (经本机 127.0.0.1 小服务按需分块拉, 见 remote_media_server.dart)
  video_player: ^2.10.1

  # 字体本地打包: 见下方 flutter.fonts 段
  # - NotoSerifSC (Regular/SemiBold, 子集 6888 字, 每 weight 4MB) 用于中文衬线大标题
  # - InterVariable (single variable ttf, 860KB) 覆盖所有英文/数字字重
  # 全部本地 asset, 不依赖外网, 不走 Google CDN.
  # 注: 字体 .otf/.ttf 文件位于 assets/fonts/, OFL 1.1 协议, 商用免费.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # codegen
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    # 厂商官方 mark —— 跟桌面端同一批素材 (simple-icons CC0 / lobe-icons MIT),
    # 见 assets/icons/providers/LICENSE-NOTICE.md
    - assets/icons/providers/
    # Pilot 头像 (猫 / 柯基静态图, 跟桌面端 PilotFace 同一批)
    - assets/pilot/
    # 语音对话的光球 (gpt-image-2 出的白底 / 黑底两张, 靠混合模式去底, 见 voice_chat_page.dart)
    - assets/voice/
    # 陶土插画 (跟桌面端 / 官网同一套: 哑光浅灰 + 一处钴蓝, 透明底明暗通用)
    - assets/clay/
    # 陶土稿 v5 插画 (透明底; -d = 夜陶版)
    - assets/clay/v5/
    # Pilot 房间场景 (整宽满底: 今天 / 钱 / 身体 / 足迹 / 关系 / 它在盯的; -d = 夜里)
    - assets/clay/v5/pilot/
    # 我的记录: 陶土分身 (青年 / 中年 / 老年 × 男女) + 四个场景台 (身体 / 衣食住行 / 足迹 / 心情)
    - assets/twin/

  # 字体本地集成. 设计语言:
  #   - 大标题 (display/headline/titleLarge): NotoSerifSC (中文衬线宋体, Claude 同款气质)
  #   - 正文/UI (title/body/label): Inter (西文中性 sans, 数字字符显示更稳)
  # 中文场景 Inter 自动 fallback 到系统 Noto Sans CJK; 大标题强制 NotoSerifSC.
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSerifSC-SemiBold.otf
          weight: 600
    # 正文 / UI: 跟桌面端同一套 Resource Han Rounded (中英同一字体, 见桌面 theme-tokens/neox.css)。
    # 由桌面的 woff2 子集转成 otf (Flutter 不认 woff2), 并去掉弯引号 ‘’“”、省略号 …、破折号 — ——
    # 它们在这套中文字体里是全角/居中的: "what’s" 会断开, "Ask anything…" 的点浮在半空。
    # 去掉后落到 Inter, 同桌面 unicode-range 的做法 (桌面只挖了弯引号, 手机英文界面多挖两个)。
    # GB2312 6763 字 + 拉丁, 每个字重 ~3.2MB (APK 内压缩后 ~1.7MB)。许可见 LICENSE-ResourceHanRounded.md
    - family: NeoxRounded
      fonts:
        - asset: assets/fonts/ResourceHanRoundedCN-Regular.otf
          weight: 400
        - asset: assets/fonts/ResourceHanRoundedCN-Medium.otf
          weight: 500
        - asset: assets/fonts/ResourceHanRoundedCN-Bold.otf
          weight: 700
    - family: Inter
      fonts:
        # InterVariable 是 axis-variable font, 单文件覆盖所有 weight (100-900);
        # Flutter 会自动按 fontWeight 选取最近的实例.
        - asset: assets/fonts/InterVariable.ttf
