# Neox Mobile CI — analyze + test + debug APK 编译验证
#
# 触发: push/PR 到 main. Release 打包不在 CI (无 keystore secrets, 本地出包策略
# 跟桌面端一致 — 见主仓 NEOX_BYOK_GLOBAL_LAUNCH_PLAN "不用 GitHub Actions 太贵").
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.x
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (fatal warnings)
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Agent SDK analyze + test (纯 Dart 包)
        working-directory: agentsdk
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: Build debug APK (编译烟测)
        run: flutter build apk --debug
