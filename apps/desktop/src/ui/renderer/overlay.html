<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neox Computer Overlay</title>
  <!-- Computer Use 被操控叠加层的入口 HTML — 跟 index.html / pet.html 平行的独立 entry.
       走 vite.config.ui.ts 的 rollupOptions.input.overlay, 打包后单独出一份 overlay bundle
       (不带 Neox 主 app, 也不带 React). 只画一层全屏 canvas.

       窗口本身是 transparent + alwaysOnTop + focusable:false, 并由主进程调用
       setIgnoreMouseEvents(true, { forward: true }) —— 鼠标事件必须穿透到下面的真实应用,
       所以这里 html/body 必须完全透明, 且不能有任何挡住内容的实心背景. -->

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    pointer-events: none;
    cursor: none;
    /* 遮罩蓝在 overlay-entry 的 #overlay-dim 上画, 这里必须保持透明,
     * 否则 Electron 合成器会把整窗涂成实心底, 下面的应用看不见. */
    }
    #overlay-root {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="overlay-root"></div>
  <script type="module" src="/overlay-entry.ts"></script>
</body>

</html>
