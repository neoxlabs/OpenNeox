# GPT-6.1 Sol
#
# OpenAI reasoning model. `none` is not declared here: this model does not
# support disabling reasoning, so the client must not show a "关闭思考" option.
id: gpt-6.1-sol
display_name: GPT-6.1 Sol
family: openai
released: 2026-10-05
availability: ga

context_window: 1050000
max_output_tokens: 128000

upstream_slugs:
  prov_openrouter: openai/gpt-6.1-sol
  prov_openai_direct: gpt-6.1-sol

capabilities:
  vision: true
  tool_use: true
  reasoning_blocks: true
  reasoning_effort:
    supported: true
    field: reasoning_effort
    values: [low, medium, high, xhigh, max]
    default: high
  prompt_cache:
    supported: true
    type: openai-prompt-cache
    key_field: prompt_cache_key
  uses_max_completion_tokens: true

effort_map:
  low:    { reasoning_effort: low }
  medium: { reasoning_effort: medium }
  high:   { reasoning_effort: high }
  xhigh:  { reasoning_effort: xhigh }
  max:    { reasoning_effort: max }

pricing:
  input_per_mtok: 2.00
  cached_input_per_mtok: 0.20
  output_per_mtok: 10.00
  currency: USD
