# DeepSeek V4 Flash — 更快更便宜的 V4 档 (相对 Pro)
#
# 官方: api-docs.deepseek.com — Flash / Pro 均支持 thinking 开关 + reasoning_effort。
# Flash 的 low 是真 low; Pro 上 low 会被映射成 high。
# "Fast" 不是 effort 档, 而是选这个 model id (vs deepseek-v4-pro)。

id: deepseek-v4-flash
display_name: DeepSeek V4 Flash
family: deepseek
released: 2026-03
availability: ga

context_window: 1000000
max_output_tokens: 384000

upstream_slugs:
  prov_openrouter: deepseek/deepseek-v4-flash

capabilities:
  vision: false
  tool_use: true
  reasoning_blocks: true
  thinking:
    supported: true
    field: thinking
    budget_unit: tokens
    min_budget: 0
    max_budget: 32000
    default_level: high
  reasoning_effort:
    supported: true
    default: high
  prompt_cache:
    supported: true
    type: openai-prompt-cache

# DeepSeek V4 thinking (api-docs.deepseek.com/guides/thinking_mode, 2026-08 核对):
#   开关: thinking:{type:enabled|disabled}; 分档: reasoning_effort low|high|max。
#   默认思考开 + effort=high。xhigh 在 Flash 上映射为 high, UI 不单独暴露。
effort_map:
  off:  { thinking: { type: disabled } }
  low:  { thinking: { type: enabled }, reasoning_effort: low }
  high: { thinking: { type: enabled }, reasoning_effort: high }
  max:  { thinking: { type: enabled }, reasoning_effort: max }

# 官方 Models & Pricing (2026-08-25 核对) — **高峰价**, 低谷是它的 50%
# ⚠️ 这里原来是 0.14 / 0.028 / 0.28 —— **V3 时代的旧价**, 只有官方价的三分之一。
pricing:
  input_per_mtok: 0.44
  cached_input_per_mtok: 0.014
  output_per_mtok: 1.32
  currency: USD
