id: gpt-5.6-terra
display_name: GPT-5.6 Terra
family: openai
released: 2026-07-09
availability: ga

context_window: 272000
max_output_tokens: 128000

upstream_slugs:
  prov_openrouter: openai/gpt-5.6-terra
  prov_openai_direct: gpt-5.6-terra

capabilities:
  vision: true
  tool_use: true
  reasoning_blocks: true
  reasoning_effort:
    supported: true
    field: reasoning_effort
    # 5.6 新增 max(最大推理深度) / ultra(自动任务委派, 仅 Sol/Terra)
    # 2026-09-04 真机实测: 5.6 系**不再接受 minimal** —— 带 reasoning_effort=minimal 的请求
    # 上游直接 400 (invalid_request_error), 同一条链路上 5.5 仍然接受。所以这里删掉它,
    # effort_map 里也删 (见下面), 界面的"最低档"由 effortPayload 的就近映射落到 low。
    values: [low, medium, high, xhigh, max, ultra]
    default: xhigh
  verbosity:
    supported: true
    field: verbosity
    values: [low, medium, high]
    default: medium
  prompt_cache:
    supported: true
    type: openai-prompt-cache
    key_field: prompt_cache_key
  uses_max_completion_tokens: true

effort_map:
  # minimal 故意缺席 —— 上游对 5.6 系拒收这个值 (400)。缺席不等于丢档:
  # resolveEffortPayload 对不在表里的档做**就近映射**, minimal → low, 用户选的"最低"
  # 仍然落地成这条链路上真正存在的最低档。硬写 minimal 的后果见 2026-09-04 实拍:
  # 上游 400 被中转包成 200 空流 → 网关判"empty stream" → 502, 会话标题永远生成不出来。
  low:     { reasoning_effort: low,     verbosity: low }
  medium:  { reasoning_effort: medium,  verbosity: medium }
  high:    { reasoning_effort: high,    verbosity: high }
  xhigh:   { reasoning_effort: xhigh,   verbosity: high }
  max:     { reasoning_effort: max,     verbosity: high }
  ultra:   { reasoning_effort: ultra,   verbosity: high }

pricing:
  input_per_mtok: 5.00
  cached_input_per_mtok: 0.50
  output_per_mtok: 30.00
  currency: USD
