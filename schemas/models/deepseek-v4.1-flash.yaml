# DeepSeek V4.1 Flash (订阅: Pro / Go)
#
# 跟 deepseek-v4-flash 同一套开关 + 分档。2026-09-13 实测:
#   · DeepSeek 官方 (anthropic 协议, 订阅主路由): thinking:{type:disabled} 真关 (思考 0);
#     low / high / max 都接受。
#   · OpenRouter / relay-c (openai-chat): 同样的字段都接受, disabled 在 relay-c 上真关。
id: deepseek-v4.1-flash
display_name: DeepSeek V4.1 Flash
family: deepseek
availability: ga

context_window: 1000000
max_output_tokens: 384000

upstream_slugs:
  prov_openrouter: deepseek/deepseek-v4.1-flash

capabilities:
  # 2026-09-22 实测吃图: DeepSeek 官方 anthropic 端点 (model=deepseek-flash) 与 OpenRouter
  # 各读一张测试图, 文字和右下角图形都答对。原来写 false 是照抄 v4-flash。
  vision: true
  tool_use: true
  reasoning_blocks: true
  thinking:
    supported: true
    field: thinking
    budget_unit: tokens
    min_budget: 0
    max_budget: 32000
    default_level: high
  reasoning_effort:
    supported: true
    default: high
  prompt_cache:
    supported: true
    type: openai-prompt-cache

effort_map:
  off:  { thinking: { type: disabled } }
  low:  { thinking: { type: enabled }, reasoning_effort: low }
  high: { thinking: { type: enabled }, reasoning_effort: high }
  max:  { thinking: { type: enabled }, reasoning_effort: max }

pricing:
  input_per_mtok: 0.345
  cached_input_per_mtok: 0.0069
  output_per_mtok: 1.38
  currency: USD
