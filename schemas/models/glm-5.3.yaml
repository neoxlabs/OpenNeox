# 智谱 GLM-5.3
#
# 推理档 2026-09-28 实测 (relay-c, GLM-5.3 第一档):
#   · 关不掉思考: thinking:{type:disabled} 照样想 (1703 reasoning token) —— 不给 off 档。
#   · reasoning_effort 调不动深浅: 第一次单测 low 69 → high 293, 复测三次反过来
#     (relay-c 527 → 121, OpenRouter 384 → 91, 经网关 404 → 274 字) = 噪声, 不给档位,
#     只一档「思考固定开着」。
#   · 这一档发 thinking:{type:enabled}: 必须有一个真实字段, 否则 schema handler 算不出有效档,
#     界面会退回家族兜底表 (off/on/max) —— 又冒出一排假档位。
id: glm-5.3
display_name: GLM-5.3
family: glm
released: 2026-09
availability: ga

context_window: 1000000
max_output_tokens: 32000

upstream_slugs:
  prov_openrouter: z-ai/glm-5.3

capabilities:
  vision: false
  tool_use: true
  reasoning_blocks: true
  thinking:
    supported: true
    field: thinking
    default_level: on
  reasoning_effort:
    supported: false
  prompt_cache:
    supported: false

effort_map:
  on: { thinking: { type: enabled } }

pricing:
  input_per_mtok: 1.40
  cached_input_per_mtok: 0.26
  output_per_mtok: 4.40
  currency: USD
