# Claude Opus 5.5
#
# 推理档 2026-09-28 实测 (同一道题, 比 reasoning token; claude-sonnet-5 代表整个 Claude 5 系):
#   · OpenRouter: 认 thinking:adaptive + output_config.effort (low 73 → high 149 → max 6000 到顶);
#     关思考要 reasoning:{enabled:false} —— 光 thinking:disabled 照样在想。
#   · relay-c (Claude 第一档): 只认 reasoning_effort; thinking / output_config 原样被忽略。
#     reasoning_effort:"none" 反而会触发思考, 所以 off 档不用它。
#   · relay-a 两个号: 所有推理参数都被吞, 从不返回推理 —— 档位在那两家不生效 (只是兜底档)。
#   · Opus 5.5 没有 off 档 (2026-09-28 经网关端到端实测): 它只有 OpenRouter 一条路由, OpenRouter
#     对 5.5 回 400 "Reasoning is mandatory for this endpoint and cannot be disabled";
#     光发 thinking:disabled 不报错但照样想 —— 给开关就是假开关。
#   三种字段一起发, 两家互不干扰 (都 200)。原生 Anthropic (BYOK 直连) 的适配器会剔掉
#   reasoning_effort / reasoning 这两个 OpenAI 系字段, 官方接口不认它们。
id: claude-opus-5-5
display_name: Claude Opus 5.5
family: claude
released: 2026-09
availability: ga

context_window: 1000000
max_output_tokens: 128000

upstream_slugs:
  prov_openrouter: anthropic/claude-opus-5.5
  prov_anthropic_direct: claude-opus-5-5

capabilities:
  vision: true
  tool_use: true
  reasoning_blocks: true
  thinking:
    supported: true
    field: thinking
    default_level: high
  reasoning_effort:
    supported: false
  prompt_cache:
    supported: true
    type: ephemeral
    max_breakpoints: 4
    breakpoint_targets:
      - tools_last
      - system_first
      - last_user_or_tool

effort_map:
  low:   { thinking: { type: adaptive }, output_config: { effort: low },    reasoning_effort: low }
  medium: { thinking: { type: adaptive }, output_config: { effort: medium }, reasoning_effort: medium }
  high:   { thinking: { type: adaptive }, output_config: { effort: high },   reasoning_effort: high }
  xhigh:  { thinking: { type: adaptive }, output_config: { effort: xhigh },  reasoning_effort: high }
  max:    { thinking: { type: adaptive }, output_config: { effort: max },    reasoning_effort: max }

pricing:
  input_per_mtok: 4.00
  cached_input_per_mtok: 0.20
  output_per_mtok: 20.00
  currency: USD
