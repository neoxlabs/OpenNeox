id: gpt-5.5
display_name: GPT-5.5
family: openai
released: 2026-04-24
availability: ga

context_window: 272000
max_output_tokens: 128000

upstream_slugs:
  prov_openrouter: openai/gpt-5.5
  prov_openai_direct: gpt-5.5

capabilities:
  vision: true
  tool_use: true
  reasoning_blocks: true
  reasoning_effort:
    supported: true
    field: reasoning_effort
    values: [minimal, low, medium, high, xhigh]
    default: xhigh
  verbosity:
    supported: true
    field: verbosity
    values: [low, medium, high]
    default: medium
  prompt_cache:
    supported: true
    type: openai-prompt-cache
    key_field: prompt_cache_key
  # 用 max_completion_tokens 而不是 max_tokens (新协议)
  uses_max_completion_tokens: true

# OpenAI reasoning_effort native levels.
# verbosity 跟 reasoning_effort 联动: minimal/low → 简洁回答, high/xhigh → 详尽回答.
# 单字段控制 = 用户少配一项, 也避免"想低 effort 但回答冗长"的矛盾配置.
effort_map:
  minimal: { reasoning_effort: minimal, verbosity: low }
  low:     { reasoning_effort: low,     verbosity: low }
  medium:  { reasoning_effort: medium,  verbosity: medium }
  high:    { reasoning_effort: high,    verbosity: high }
  xhigh:   { reasoning_effort: xhigh,   verbosity: high }

pricing:
  input_per_mtok: 5.00
  cached_input_per_mtok: 0.50
  output_per_mtok: 30.00
  currency: USD
