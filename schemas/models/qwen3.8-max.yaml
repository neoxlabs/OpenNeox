# 通义 Qwen 3.8 Max
#
# 推理档 2026-09-28 实测 (relay-c, 第一档):
#   · enable_thinking:false 真关 (0 reasoning token); thinking:{type:disabled} 不认。
#   · 开着思考时 reasoning_effort low / high 生效 (495 → 757)。
id: qwen3.8-max
display_name: Qwen 3.8 Max
family: qwen
released: 2026-09
availability: ga

context_window: 1000000
max_output_tokens: 32768

upstream_slugs:
  prov_openrouter: qwen/qwen3.8-max-0902

capabilities:
  tool_use: true
  reasoning_blocks: true
  thinking:
    supported: true
    field: enable_thinking
    default_level: high
  prompt_cache:
    supported: false

effort_map:
  off:  { enable_thinking: false, reasoning: { enabled: false } }
  low:  { enable_thinking: true, reasoning_effort: low }
  high: { enable_thinking: true, reasoning_effort: high }

pricing:
  input_per_mtok: 2.32
  cached_input_per_mtok: 0.46
  output_per_mtok: 6.97
  currency: USD
