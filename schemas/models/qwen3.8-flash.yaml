# Qwen3.8 Flash (订阅: Pro / Go)
#
# 2026-09-13 实测 (阿里云百炼 / OpenRouter):
#   · 关思考两家写法不同: 百炼认 enable_thinking:false, OpenRouter 认 reasoning:{enabled:false}。
#     off 档两个字段一起发 —— 各自忽略不认识的那个, 实测两条路由都真的不思考了。
#   · 开 / 加深: enable_thinking:true; max 档再加 reasoning_effort:high (百炼接受, 思考更长)。
id: qwen3.8-flash
display_name: Qwen3.8 Flash
family: qwen
availability: ga

context_window: 1000000
max_output_tokens: 32768

upstream_slugs:
  prov_openrouter: qwen/qwen3.8-flash

capabilities:
  tool_use: true
  reasoning_blocks: true
  thinking:
    supported: true
    field: enable_thinking
    default_level: on
  prompt_cache:
    supported: false

effort_map:
  off: { enable_thinking: false, reasoning: { enabled: false } }
  on:  { enable_thinking: true }
  max: { enable_thinking: true, reasoning_effort: high }

pricing:
  input_per_mtok: 0.195
  cached_input_per_mtok: 0.039
  output_per_mtok: 0.611
  currency: USD
